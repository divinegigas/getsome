# Builds the Starburn Android app (APK) whenever the game changes on its branch,
# and puts it on the repository's Releases page as "Starburn (latest build)".
name: Starburn Android app

on:
  push:
    branches: [claude/android-vertical-shooter-tsf1vp]
    paths: ['shooter/**', '.github/workflows/starburn-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starburn-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shooter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shooter/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: shooter/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk starburn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: starburn-apk
          path: shooter/starburn.apk

      - name: Publish to Releases as "Starburn (latest build)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete starburn-latest --yes --cleanup-tag || true
          gh release create starburn-latest starburn.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Starburn (latest build #${{ github.run_number }})" \
            --notes "Tap **starburn.apk** below to download, then open it to install. Builds install over the previous one and keep your progress."
